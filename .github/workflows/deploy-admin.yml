name: Deploy Admin to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Cache de Turbo para reutilizar artefactos de compilación entre runs
      - name: Cache Turbo build artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-admin-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-admin-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Admin App
        run: pnpm build --filter=pet-u-admin
        env:
          TURBO_CACHE_DIR: .turbo

      - name: Verify build output
        run: |
          if [ -d "apps/admin/dist" ]; then
            echo "✅ Build output directory found."
            ls -al apps/admin/dist
          else
            echo "❌ ERROR: Build output directory apps/admin/dist NOT found."
            find apps/admin -maxdepth 2
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PET_U_FE87C }}
          projectId: pet-u-fe87c
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
