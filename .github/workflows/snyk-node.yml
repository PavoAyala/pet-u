name: Snyk Node Security Scan

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'CRM/**'
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/snyk-node.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'CRM/**'
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/snyk-node.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  snyk:
    name: Snyk Open Source Scan
    runs-on: ubuntu-latest
    env:
      SNYK_ORG: pavoayala
      ENABLE_CODE_SCANNING_UPLOAD: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Snyk token
        run: |
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "repository=${GITHUB_REPOSITORY}"

          if [ -n "${SNYK_TOKEN_VAR}" ]; then
            echo "Found vars.SNYK_TOKEN. This workflow expects a secret, not a variable."
          fi

          if [ -z "${SNYK_TOKEN}" ]; then
            echo "SNYK_TOKEN is not configured for this workflow."
            echo "Verify that Actions secret 'SNYK_TOKEN' exists in this repository or is available from the organization."
            exit 1
          fi

          echo "SNYK_TOKEN secret is available."
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_TOKEN_VAR: ${{ vars.SNYK_TOKEN }}

      - name: Run Snyk scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --detection-depth=4 --severity-threshold=high --org=${{ env.SNYK_ORG }} --sarif-file-output=snyk.sarif

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('snyk.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: snyk.sarif
